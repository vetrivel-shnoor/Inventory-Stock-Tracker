version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: stocktracker_mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stocktracker_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: stocktracker_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: stocktracker_backend
    env_file: ./Backend/.env
    volumes:
      - backend_uploads:/app/public/uploads

    depends_on:
      - mongodb
      - redis
      - minio
    restart: unless-stopped

  frontend:
    build:
      context: ./Web
      dockerfile: Dockerfile
      # Providing build args if needed by Vite
      args:
        - VITE_API_URL=/api
    container_name: stocktracker_frontend
    ports:
      - "3010:80" # Nginx Gateway
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  minio_data:
  backend_uploads:
